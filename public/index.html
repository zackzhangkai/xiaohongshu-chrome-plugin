<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小红书采集助手 · 本地知识库</title>
<style>
:root { --bg:#f6f1e7; --panel:#fffdf8; --ink:#2f2a24; --muted:#8a8072; --line:#e7dfd0; --accent:#c4452c; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
header { display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between; align-items:flex-end; padding:24px; border-bottom:1px solid var(--line); background:var(--panel); }
.eyebrow { margin:0 0 4px; font-size:11px; letter-spacing:.18em; color:var(--muted); }
h1 { margin:0; font-size:21px; }
header p.sub { margin:4px 0 0; color:var(--muted); font-size:13px; }
.pairing { display:flex; align-items:center; gap:8px; padding:10px 12px; border:1px dashed var(--line); border-radius:10px; background:#faf6ee; font-size:13px; }
.pairing code { font-family:ui-monospace,Menlo,monospace; font-size:12px; word-break:break-all; max-width:34ch; color:var(--ink); }
button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:8px; padding:6px 12px; cursor:pointer; }
button:hover { border-color:var(--muted); }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
main { max-width:960px; margin:0 auto; padding:20px 24px 48px; }
.list-head { display:flex; justify-content:space-between; align-items:baseline; margin:8px 2px 14px; }
h2 { margin:0; font-size:17px; }
#message { color:var(--accent); font-size:13px; min-height:20px; margin:0 2px 12px; }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
.card { display:block; text-align:left; padding:0; overflow:hidden; border:1px solid var(--line); border-radius:12px; background:var(--panel); transition:transform .12s; }
.card:hover { transform:translateY(-2px); border-color:var(--muted); }
.card .cover { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#eee6d8; }
.card .no-cover { width:100%; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; background:#f0e9dc; color:var(--muted); font-size:12px; }
.card .body { padding:10px 12px 12px; }
.card h3 { margin:0 0 6px; font-size:14px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.meta { color:var(--muted); font-size:12px; display:flex; flex-wrap:wrap; gap:8px; }
.empty { padding:48px 0; text-align:center; color:var(--muted); }
.detail { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px 24px; }
.detail h2 { font-size:19px; margin-bottom:8px; }
.detail .content { white-space:pre-wrap; word-break:break-word; margin:14px 0; }
.gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; margin:16px 0; }
.gallery img { width:100%; border-radius:8px; border:1px solid var(--line); display:block; }
.actions { display:flex; gap:10px; margin-top:18px; padding-top:14px; border-top:1px solid var(--line); }
.actions a { color:var(--ink); font-size:13px; align-self:center; }
[hidden] { display:none; }
</style>
</head>
<body>
<header>
  <div>
    <p class="eyebrow">XHS COLLECTOR · 本地服务</p>
    <h1>小红书采集助手</h1>
    <p class="sub">插件采集的笔记保存在本机，在这里查看和管理。</p>
  </div>
  <div class="pairing">
    <span>本机配对码</span>
    <code id="pairing-key">读取中…</code>
    <button id="copy-key" type="button">复制</button>
  </div>
</header>
<main>
  <p id="message" role="alert"></p>
  <section id="list-view">
    <div class="list-head"><h2>知识库笔记</h2><button id="refresh" type="button">刷新</button></div>
    <div id="notes" class="cards"></div>
    <div id="empty" class="empty" hidden>
      <p>还没有采集记录。</p>
      <p>在 Chrome 打开一篇小红书图文笔记，点击插件弹窗里的「采集」。</p>
    </div>
  </section>
  <section id="detail-view" hidden>
    <p><button id="back" type="button">← 返回列表</button></p>
    <article id="detail" class="detail"></article>
  </section>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const IMAGE_PATH = /^\/imports\/[a-f0-9]{64}\.(png|jpg|webp|gif)$/;
const UUID = /^[0-9a-f-]{36}$/;
const message = text => { $('message').textContent = text || ''; };
const fmtDate = ts => (ts ? new Date(ts).toLocaleString('zh-CN', { hour12: false }) : '');

async function api(path, options) {
  const response = await fetch(path, { ...options, headers: { ...(options?.body ? { 'Content-Type': 'application/json' } : {}), ...(options?.headers || {}) } });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `请求失败（${response.status}）`);
  return data;
}

async function loadPairing() {
  try { $('pairing-key').textContent = (await api('/api/collector/pairing')).key; }
  catch { $('pairing-key').textContent = '读取失败，请确认服务运行中'; }
}
$('copy-key').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('pairing-key').textContent); message('配对码已复制，粘贴到插件设置页即可。'); }
  catch { message('复制失败，请手动选中文本复制。'); }
});

function statsLine(note) {
  const stats = note.collector?.stats || {};
  const parts = [];
  if (stats.likes) parts.push(`赞 ${stats.likes}`);
  if (stats.collects) parts.push(`藏 ${stats.collects}`);
  if (stats.comments) parts.push(`评 ${stats.comments}`);
  return parts.join(' · ');
}

async function loadNotes() {
  $('detail-view').hidden = true; $('list-view').hidden = false;
  const list = await api('/api/notes');
  const wrap = $('notes'); wrap.textContent = '';
  $('empty').hidden = list.length > 0;
  for (const note of list) {
    const card = document.createElement('button');
    card.type = 'button'; card.className = 'card';
    if (IMAGE_PATH.test(note.cover || '')) {
      const img = document.createElement('img'); img.className = 'cover'; img.src = note.cover; img.alt = '';
      card.appendChild(img);
    } else {
      const ph = document.createElement('div'); ph.className = 'no-cover'; ph.textContent = '无封面';
      card.appendChild(ph);
    }
    const body = document.createElement('div'); body.className = 'body';
    const title = document.createElement('h3'); title.textContent = note.title || '未命名笔记';
    const meta = document.createElement('p'); meta.className = 'meta';
    const line = statsLine(note);
    meta.textContent = `${fmtDate(note.updatedAt)}${line ? ` · ${line}` : ''}`;
    body.append(title, meta); card.appendChild(body);
    card.addEventListener('click', () => openDetail(note.id).catch(error => message(error.message)));
    wrap.appendChild(card);
  }
}

async function openDetail(id) {
  if (!UUID.test(id || '')) throw new Error('笔记编号无效');
  const note = await api(`/api/notes/${id}`);
  const view = $('detail'); view.textContent = '';
  const title = document.createElement('h2'); title.textContent = note.title || '未命名笔记';
  const meta = document.createElement('p'); meta.className = 'meta';
  const captured = note.collector?.capturedAt;
  meta.textContent = [fmtDate(captured || note.updatedAt), note.collector?.author, statsLine(note)].filter(Boolean).join(' · ');
  const content = document.createElement('p'); content.className = 'content'; content.textContent = note.content || '';
  view.append(title, meta, content);
  const images = (Array.isArray(note.images) ? note.images : []).filter(src => IMAGE_PATH.test(src));
  if (images.length) {
    const gallery = document.createElement('div'); gallery.className = 'gallery';
    for (const src of images) {
      const img = document.createElement('img'); img.src = src; img.alt = '采集配图'; img.loading = 'lazy';
      gallery.appendChild(img);
    }
    view.appendChild(gallery);
  }
  const actions = document.createElement('div'); actions.className = 'actions';
  if (note.sourceUrl) {
    const link = document.createElement('a'); link.href = note.sourceUrl; link.target = '_blank'; link.rel = 'noopener noreferrer';
    link.textContent = '查看原文 ↗';
    actions.appendChild(link);
  }
  const remove = document.createElement('button'); remove.type = 'button'; remove.textContent = '删除这篇笔记';
  remove.addEventListener('click', async () => {
    if (!confirm('删除后不可恢复（镜像文件夹不会自动删除），确定删除这篇笔记？')) return;
    try { await api(`/api/notes/${note.id}`, { method: 'DELETE' }); message('已删除。'); loadNotes().catch(error => message(error.message)); }
    catch (error) { message(error.message); }
  });
  actions.appendChild(remove);
  view.appendChild(actions);
  $('list-view').hidden = true; $('detail-view').hidden = false;
  window.scrollTo(0, 0);
}

$('back').addEventListener('click', () => { $('detail-view').hidden = true; $('list-view').hidden = false; });
$('refresh').addEventListener('click', () => loadNotes().catch(error => message(error.message)));

loadPairing();
const deepLink = new URLSearchParams(location.search).get('knowledgeNote');
if (deepLink && UUID.test(deepLink)) openDetail(deepLink).catch(() => { message('未找到插件要打开的笔记，已显示全部笔记。'); loadNotes().catch(error => message(error.message)); });
else loadNotes().catch(error => message(error.message));
</script>
</body>
</html>
